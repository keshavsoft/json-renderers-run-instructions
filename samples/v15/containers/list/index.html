<!DOCTYPE html>
<html lang="en">

<head>
    <script>
        if (!location.pathname.endsWith('/') && !location.pathname.endsWith('.html')) {
            location.replace(location.pathname + '/' + location.search + location.hash);
        }
    </script>

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Lists Showcase | Samples</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        body {
            background-color: #f8fafc;
            font-family: system-ui, -apple-system, sans-serif;
        }

        .container {
            max-width: 900px;
        }
    </style>
</head>

<body class="py-5">
    <div class="container">
        <div class="d-flex justify-content-between align-items-center mb-4">
            <div>
                <a href="../../" class="text-decoration-none small text-muted">&larr; Back to V15 Launch Pad</a>
                <h3 class="fw-bold mb-0 mt-1">List Showcase</h3>
                <p class="text-muted small mb-0">Declarative List variants: <code>list.group</code> with badges and <code>list.ordered</code></p>
            </div>
            <span class="badge bg-warning-subtle text-warning border border-warning px-3 py-2">list.*</span>
        </div>

        <div class="row g-4">
            <div class="col-md-6">
                <div class="card shadow-sm border-0 p-4">
                    <h5 class="fw-bold mb-3 text-secondary">list.group</h5>
                    <div id="list-group-container"></div>
                </div>
            </div>
            <div class="col-md-6">
                <div class="card shadow-sm border-0 p-4">
                    <h5 class="fw-bold mb-3 text-secondary">list.ordered</h5>
                    <div id="list-ordered-container"></div>
                </div>
            </div>
        </div>
    </div>

    <script type="module" src="https://keshavsoft.github.io/json-to-dom/dist/v42/min.js"></script>
    <script type="module" src="./index.js"></script>

</html>
