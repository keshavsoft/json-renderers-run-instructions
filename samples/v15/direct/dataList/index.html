<!DOCTYPE html>
<html lang="en">

<head>
    <script>
        if (!location.pathname.endsWith('/') && !location.pathname.endsWith('.html')) {
            location.replace(location.pathname + '/' + location.search + location.hash);
        }
    </script>

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>DataList Simple | Samples</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        body {
            background-color: #f8fafc;
            font-family: system-ui, -apple-system, sans-serif;
        }

        .container {
            max-width: 600px;
        }
    </style>
</head>

<body class="py-5">
    <div class="container">
        <div class="d-flex justify-content-between align-items-center mb-4">
            <div>
                <a href="../../" class="text-decoration-none small text-muted">&larr; Back to V15 Launch Pad</a>
                <h3 class="fw-bold mb-0 mt-1">DataList Simple</h3>
                <p class="text-muted small mb-0">Autocomplete <code>&lt;datalist&gt;</code> options for text inputs</p>
            </div>
            <span class="badge bg-info-subtle text-info border border-info px-3 py-2">dataList.simple</span>
        </div>

        <div class="card shadow-sm border-0 p-4 mb-4">
            <h5 class="fw-bold text-secondary mb-3">Live Autocomplete Inputs</h5>
            <div class="mb-3">
                <label for="browser-input" class="form-label fw-semibold">Choose Browser:</label>
                <input class="form-control" list="BrowserDatalist" id="browser-input" placeholder="Type to search browsers...">
            </div>
            <div class="mb-3">
                <label for="lang-input" class="form-label fw-semibold">Choose Programming Language:</label>
                <input class="form-control" list="ProgrammingLanguages" id="lang-input" placeholder="Type to search languages...">
            </div>
        </div>

        <div id="dom-render-container">
            <!-- Rendered DataLists inserted here -->
        </div>
    </div>

    <script type="module" src="https://keshavsoft.github.io/json-to-dom/dist/v42/min.js"></script>
    <script type="module" src="./index.js"></script>
</body>

</html>
