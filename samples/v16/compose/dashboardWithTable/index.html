<!DOCTYPE html>
<html lang="en">

<head>
    <script>
        if (!location.pathname.endsWith('/') && !location.pathname.endsWith('.html')) {
            location.replace(location.pathname + '/' + location.search + location.hash);
        }
    </script>

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dashboard with Table | Compose</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        body {
            background-color: #f8fafc;
            font-family: system-ui, -apple-system, sans-serif;
        }

        .container {
            max-width: 1040px;
        }
    </style>
</head>

<body class="py-5">
    <div class="container">
        <div class="d-flex justify-content-between align-items-center mb-4">
            <div>
                <a href="../../" class="text-decoration-none small text-muted">&larr; Back to V15 Launch Pad</a>
                <h3 class="fw-bold mb-0 mt-1">Compose: Analytics Dashboard</h3>
                <p class="text-muted small mb-0">Multi-container composition: KPI cards (<code>menu.cards</code>) + Data Table (<code>table.simple</code>)</p>
            </div>
            <span class="badge bg-purple-subtle text-purple border border-purple px-3 py-2" style="background:#f3e8ff; color:#7e22ce; border-color:#d8b4fe;">compose</span>
        </div>

        <!-- 1. KPI Cards Slot -->
        <div class="mb-5">
            <h5 class="fw-bold text-secondary mb-3">Live Performance Metrics</h5>
            <div id="kpi-cards-slot"></div>
        </div>

        <!-- 2. Data Table Slot -->
        <div class="mb-5">
            <h5 class="fw-bold text-secondary mb-3">Recent Transactions</h5>
            <div id="invoices-table-slot"></div>
        </div>
    </div>

    <script type="module" src="https://keshavsoft.github.io/json-to-dom/dist/v42/min.js"></script>
    <script type="module" src="./index.js"></script>
</body>

</html>
