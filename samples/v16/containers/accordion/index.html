<!DOCTYPE html>
<html lang="en">

<head>
    <script>
        if (!location.pathname.endsWith('/') && !location.pathname.endsWith('.html')) {
            location.replace(location.pathname + '/' + location.search + location.hash);
        }
    </script>

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Accordion Simple | Samples</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        body {
            background-color: #f8fafc;
            font-family: system-ui, -apple-system, sans-serif;
        }

        .container {
            max-width: 800px;
        }
    </style>
</head>

<body class="py-5">
    <div class="container">
        <div class="d-flex justify-content-between align-items-center mb-4">
            <div>
                <a href="../../" class="text-decoration-none small text-muted">&larr; Back to V15 Launch Pad</a>
                <h3 class="fw-bold mb-0 mt-1">Accordion</h3>
                <p class="text-muted small mb-0">Collapsible interactive sections rendered via <code>accordion.simple</code></p>
            </div>
            <span class="badge bg-primary-subtle text-primary border border-primary px-3 py-2">accordion.simple</span>
        </div>

        <div id="dom-render-container">
            <!-- Rendered Accordion inserted here -->
        </div>

    <!-- Bootstrap 5 JS for interactive collapse -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <script type="module" src="https://keshavsoft.github.io/json-to-dom/dist/v42/min.js"></script>
